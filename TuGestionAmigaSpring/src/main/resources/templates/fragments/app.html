<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="appPage(active, title, subtitle, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Tu Gestión Amiga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tga-web.css}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark tga-navbar">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-book-half me-2"></i>Tu Gestión Amiga
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#tgaSidebar" aria-controls="tgaSidebar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="ms-auto d-flex align-items-center gap-3 text-white small">
            <div class="d-none d-md-flex align-items-center gap-2">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name"></span>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid tga-layout">
    <div class="row g-0">
        <div class="col-lg-2">
            <div class="offcanvas-lg offcanvas-start tga-sidebar" tabindex="-1" id="tgaSidebar">
                <div class="offcanvas-header d-lg-none">
                    <h5 class="offcanvas-title">Menú</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body p-0">
                    <div class="tga-sidebar-header">
                        <p class="tga-sidebar-title">Navegación</p>
                    </div>
                    <nav class="nav flex-column">
                        <a class="nav-link" th:href="@{/dashboard}" th:classappend="${active} == 'dashboard' ? 'active' : ''"><i class="bi bi-house-door"></i>Inicio</a>
                        <a sec:authorize="hasRole('ADMIN')" class="nav-link" th:href="@{/usuarios}" th:classappend="${active} == 'usuarios' ? 'active' : ''"><i class="bi bi-people"></i>Usuarios</a>
                        <a class="nav-link" th:href="@{/libros}" th:classappend="${active} == 'libros' ? 'active' : ''"><i class="bi bi-journal-bookmark"></i>Libros</a>
                        <a class="nav-link" th:href="@{/prestamos}" th:classappend="${active} == 'prestamos' ? 'active' : ''"><i class="bi bi-arrow-left-right"></i>Préstamos</a>
                        <a class="nav-link" th:href="@{/compras}" th:classappend="${active} == 'compras' ? 'active' : ''"><i class="bi bi-cart"></i>Compras</a>
                    </nav>
                </div>
            </div>
        </div>

        <main class="col-lg-10 tga-content">
            <div class="tga-page-header">
                <div>
                    <h1 th:text="${title}">Título</h1>
                    <p class="tga-subtitle" th:text="${subtitle}">Subtítulo</p>
                </div>
            </div>

            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
