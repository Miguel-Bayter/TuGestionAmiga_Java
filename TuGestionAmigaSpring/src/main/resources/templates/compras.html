<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app :: appPage('compras', 'Compras', 'Registrar compras y controlar stock', ~{::content})}">
<div th:fragment="content">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-3">
        <div class="col-xl-6">
            <div class="card tga-card">
                <div class="card-header">
                    <strong><i class="bi bi-cart-plus me-1"></i>Registrar compra</strong>
                </div>
                <div class="card-body">
                    <form th:action="@{/compras}" method="post" class="row g-3">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="accion" value="registrarCompra"/>

                        <div class="col-12" th:if="${esAdmin}">
                            <label class="form-label">Usuario</label>
                            <select class="form-select" name="idUsuario" required>
                                <option value="">Seleccione...</option>
                                <option th:each="u : ${usuarios}"
                                        th:value="${u.idUsuario}"
                                        th:text="${u.idUsuario + ' - ' + u.nombre + ' (' + u.correo + ')'}">
                                </option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Libro</label>
                            <select class="form-select" name="idLibro" required>
                                <option value="">Seleccione...</option>
                                <option th:each="l : ${libros}"
                                        th:value="${l.idLibro}"
                                        th:selected="${idLibroSeleccionado != null && idLibroSeleccionado == l.idLibro}"
                                        th:attr="data-valor=${l.valor != null ? l.valor : 0}"
                                        th:text="${l.idLibro + ' - ' + l.titulo + ' (Stock: ' + l.stock + ')'}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Fecha compra</label>
                            <input type="date" class="form-control" name="fechaCompra" required
                                   th:attr="min=${hoy},max=${hoy}"
                                   th:value="${hoy}" readonly/>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Valor unitario (según catálogo)</label>
                            <input type="text" class="form-control" id="valorUnitario" value="0.00" readonly/>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Cantidad de libros a comprar</label>
                            <input type="number" min="1" class="form-control" id="cantidadCompra" name="cantidad" value="1" required/>
                            <div class="form-text">
                                Total: <strong id="totalCompra">0.00</strong>
                            </div>
                        </div>

                        <div class="col-12 d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check2-circle me-1"></i>Registrar
                            </button>
                        </div>
                    </form>

                    <script>
                        (function () {
                            var selectLibro = document.querySelector('select[name="idLibro"]');
                            var inputCantidad = document.getElementById('cantidadCompra');
                            var inputValor = document.getElementById('valorUnitario');
                            var totalLabel = document.getElementById('totalCompra');

                            function getValorSeleccionado() {
                                if (!selectLibro) return 0;
                                var opt = selectLibro.options[selectLibro.selectedIndex];
                                if (!opt) return 0;
                                var v = opt.getAttribute('data-valor');
                                var n = parseFloat(v);
                                return isNaN(n) ? 0 : n;
                            }

                            function getCantidad() {
                                var n = parseInt(inputCantidad && inputCantidad.value ? inputCantidad.value : '1', 10);
                                return isNaN(n) || n <= 0 ? 1 : n;
                            }

                            function recalcular() {
                                var valor = getValorSeleccionado();
                                var cant = getCantidad();
                                inputValor.value = valor.toFixed(2);
                                totalLabel.textContent = (valor * cant).toFixed(2);
                            }

                            if (selectLibro) {
                                selectLibro.addEventListener('change', recalcular);
                            }
                            if (inputCantidad) {
                                inputCantidad.addEventListener('input', recalcular);
                            }
                            recalcular();
                        })();
                    </script>
                </div>
            </div>
        </div>
    </div>

    <div class="card tga-card mt-3">
        <div class="card-header">
            <strong>Listado de compras</strong>
        </div>
        <div class="card-body">
            <div class="table-responsive tga-table">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Precio</th>
                        <th th:if="${esAdmin}">ID Usuario</th>
                        <th>ID Libro</th>
                        <th th:if="${esAdmin}">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${compras}">
                        <td th:text="${c.idCompra}"></td>
                        <td th:text="${c.fechaCompra}"></td>
                        <td th:text="${c.precio}"></td>
                        <td th:if="${esAdmin}" th:text="${c.idUsuario != null ? c.idUsuario : ''}"></td>
                        <td th:text="${c.idLibro != null ? c.idLibro : ''}"></td>
                        <td th:if="${esAdmin}">
                            <form th:action="@{/compras}" method="post" class="d-inline">
                                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="accion" value="eliminar"/>
                                <input type="hidden" name="id" th:value="${c.idCompra}"/>
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar compra?');">
                                    <i class="bi bi-trash me-1"></i>Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</html>
