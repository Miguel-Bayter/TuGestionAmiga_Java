<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app :: appPage('libros', 'Libros', 'CRUD de la tabla libro', ~{::content})}">
<div th:fragment="content">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-3">
        <div class="col-xl-4" th:if="${esAdmin}">
            <div class="card tga-card">
                <div class="card-header">
                    <strong th:text="${libroEdit} != null ? 'Editar libro' : 'Registrar libro'"></strong>
                </div>
                <div class="card-body">
                    <form th:action="@{/libros}" method="post" class="row g-3">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="accion" th:value="${libroEdit} != null ? 'actualizar' : 'crear'"/>
                        <input th:if="${libroEdit} != null" type="hidden" name="id" th:value="${libroEdit.idLibro}"/>

                        <div class="col-12">
                            <label class="form-label">Título</label>
                            <input type="text" class="form-control" name="titulo" required
                                   th:value="${libroEdit != null ? libroEdit.titulo : ''}"/>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Autor</label>
                            <input type="text" class="form-control" name="autor" required
                                   th:value="${libroEdit != null ? libroEdit.autor : ''}"/>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" name="descripcion" rows="3"
                                      th:text="${libroEdit != null && libroEdit.descripcion != null ? libroEdit.descripcion : ''}"></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Stock</label>
                            <input type="number" min="0" class="form-control" name="stock" required
                                   th:value="${libroEdit != null ? libroEdit.stock : 0}"/>
                            <div class="form-text">La disponibilidad se calcula automáticamente: <code>stock &gt; 0</code>.</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Género / Categoría (opcional)</label>
                            <select class="form-select" name="idCategoria">
                                <option value="" th:selected="${libroEdit == null || libroEdit.idCategoria == null}">-- Sin categoría --</option>
                                <option th:each="c : ${categorias}"
                                        th:value="${c.idCategoria}"
                                        th:selected="${libroEdit != null && libroEdit.idCategoria != null && libroEdit.idCategoria == c.idCategoria}"
                                        th:text="${c.idCategoria + ' - ' + c.nombreCategoria}">
                                </option>
                            </select>
                        </div>

                        <div class="col-12 d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${libroEdit} != null ? 'Actualizar' : 'Registrar'"></span>
                            </button>
                        </div>

                        <div class="col-12 d-grid" th:if="${libroEdit} != null">
                            <a class="btn btn-outline-secondary" th:href="@{/libros(accion='listar')}">
                                <i class="bi bi-x-circle me-1"></i>Cancelar edición
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div th:class="${esAdmin} ? 'col-xl-8' : 'col-12'">
            <div class="card tga-card">
                <div class="card-header">
                    <strong>Listado</strong>
                </div>
                <div class="card-body">
                    <div class="table-responsive tga-table">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Stock</th>
                                <th>Disponible</th>
                                <th>Categoría</th>
                                <th th:if="${esAdmin}">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="l : ${libros}">
                                <td th:text="${l.idLibro}"></td>
                                <td th:text="${l.titulo}"></td>
                                <td th:text="${l.autor}"></td>
                                <td th:text="${l.stock}"></td>
                                <td th:text="${l.disponible} ? 'Sí' : 'No'"></td>
                                <td th:text="${l.idCategoria != null ? (l.idCategoria + ' - ' + (l.nombreCategoria != null ? l.nombreCategoria : '')) : '-'}"></td>
                                <td th:if="${esAdmin}">
                                    <a class="btn btn-sm btn-outline-primary"
                                       th:href="@{/libros(accion='editar', id=${l.idLibro})}">
                                        <i class="bi bi-pencil"></i>
                                        Editar
                                    </a>

                                    <form th:action="@{/libros}" method="post" class="d-inline">
                                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <input type="hidden" name="accion" value="eliminar"/>
                                        <input type="hidden" name="id" th:value="${l.idLibro}"/>
                                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar libro?');">
                                            <i class="bi bi-trash me-1"></i>Eliminar
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
