<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth :: authPage('Tu Gestión Amiga - Registrarse', ~{::content})}">
<div th:fragment="content" class="container py-5">
    <div class="tga-auth-card">
        <div class="card tga-card">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="rounded-3 bg-primary bg-opacity-10 p-2">
                        <i class="bi bi-person-plus text-primary fs-4"></i>
                    </div>
                    <div>
                        <div class="tga-auth-brand">Tu Gestión Amiga</div>
                        <div class="text-muted">Crear cuenta</div>
                    </div>
                </div>

                <h1 class="h4 mb-4">Registrarse</h1>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/register}" method="post" class="row g-3">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="col-12">
                        <label class="form-label">Nombre</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" name="nombre" required data-focus="true" th:value="${nombre}">
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Correo</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" name="correo" required th:value="${correo}">
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="contrasena" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Confirmar contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" class="form-control" name="contrasena2" required>
                        </div>
                    </div>

                    <div class="col-12 d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-person-check me-1"></i> Crear cuenta
                        </button>
                    </div>
                </form>

                <div class="mt-3 tga-form-hint">
                    ¿Ya tienes cuenta?
                    <a th:href="@{/login}" class="link-primary">Inicia sesión aquí</a>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
