<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app :: appPage('error', 'Ocurrió un error', 'Se produjo un error procesando la solicitud', ~{::content})}">
<div th:fragment="content">
    <div class="card tga-card">
        <div class="card-body">
            <p class="mb-1" th:text="${error}"></p>
            <p class="text-muted mb-0" th:if="${message}" th:text="${message}"></p>
            <div class="mt-3">
                <a class="btn btn-outline-primary" th:href="@{/dashboard}">
                    <i class="bi bi-arrow-left me-1"></i>Volver
                </a>
            </div>
        </div>
    </div>
</div>
</html>
