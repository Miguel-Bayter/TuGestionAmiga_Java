<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app :: appPage('prestamos', 'Préstamos', 'Registrar préstamo y devolución', ~{::content})}">
<div th:fragment="content">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-3">
        <div class="col-xl-6">
            <div class="card tga-card">
                <div class="card-header">
                    <strong><i class="bi bi-plus-circle me-1"></i>Registrar préstamo</strong>
                </div>
                <div class="card-body">
                    <form th:action="@{/prestamos}" method="post" class="row g-3">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="accion" value="registrarPrestamo"/>

                        <div class="col-12" th:if="${esAdmin}">
                            <label class="form-label">Usuario</label>
                            <select class="form-select" name="idUsuario" required>
                                <option value="">Seleccione...</option>
                                <option th:each="u : ${usuarios}"
                                        th:value="${u.idUsuario}"
                                        th:text="${u.idUsuario + ' - ' + u.nombre + ' (' + u.correo + ')'}">
                                </option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Libro</label>
                            <select class="form-select" name="idLibro" required>
                                <option value="">Seleccione...</option>
                                <option th:each="l : ${libros}"
                                        th:value="${l.idLibro}"
                                        th:text="${l.idLibro + ' - ' + l.titulo + ' (' + (l.disponible ? 'Disponible' : 'No disponible') + ')'}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Fecha préstamo</label>
                            <input type="date" class="form-control" name="fechaPrestamo" required
                                   th:attr="min=${T(java.time.LocalDate).now()},max=${T(java.time.LocalDate).now()}"/>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Fecha devolución</label>
                            <input type="date" class="form-control" name="fechaDevolucion" required
                                   th:attr="min=${T(java.time.LocalDate).now()}"/>
                        </div>

                        <div class="col-12 d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check2-circle me-1"></i>Registrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-xl-6" th:if="${esAdmin}">
            <div class="card tga-card">
                <div class="card-header">
                    <strong><i class="bi bi-arrow-return-left me-1"></i>Registrar devolución</strong>
                </div>
                <div class="card-body">
                    <form th:action="@{/prestamos}" method="post" class="row g-3">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="accion" value="registrarDevolucion"/>

                        <div class="col-12">
                            <label class="form-label">ID Préstamo</label>
                            <input type="number" class="form-control" name="idPrestamo" required/>
                        </div>

                        <div class="col-12 d-grid">
                            <button type="submit" class="btn btn-outline-primary">
                                <i class="bi bi-box-arrow-in-left me-1"></i>Devolver
                            </button>
                        </div>
                    </form>

                    <div class="mt-3 text-muted small">
                        La devolución cambia el estado del préstamo a <code>DEVUELTO</code> y marca el libro como disponible.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card tga-card mt-3">
        <div class="card-header">
            <strong>Listado de préstamos</strong>
        </div>
        <div class="card-body">
            <div class="table-responsive tga-table">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Fecha préstamo</th>
                        <th>Fecha devolución</th>
                        <th>Estado</th>
                        <th th:if="${esAdmin}">ID Usuario</th>
                        <th>ID Libro</th>
                        <th th:if="${esAdmin}">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${prestamos}">
                        <td th:text="${p.idPrestamo}"></td>
                        <td th:text="${p.fechaPrestamo}"></td>
                        <td th:text="${p.fechaDevolucion}"></td>
                        <td>
                            <span th:if="${p.estado != null && #strings.equalsIgnoreCase(p.estado, 'DEVUELTO')}" class="badge text-bg-secondary">DEVUELTO</span>
                            <span th:unless="${p.estado != null && #strings.equalsIgnoreCase(p.estado, 'DEVUELTO')}" class="badge text-bg-success">ACTIVO</span>
                        </td>
                        <td th:if="${esAdmin}" th:text="${p.idUsuario != null ? p.idUsuario : ''}"></td>
                        <td th:text="${p.idLibro != null ? p.idLibro : ''}"></td>
                        <td th:if="${esAdmin}">
                            <form th:action="@{/prestamos}" method="post" class="d-inline">
                                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="accion" value="eliminar"/>
                                <input type="hidden" name="id" th:value="${p.idPrestamo}"/>
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar préstamo?');">
                                    <i class="bi bi-trash me-1"></i>Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</html>
