<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login - TuGestionAmiga</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Iniciar sesión</h1>

        <div th:if="${param.error}" class="alert alert-error">
            Credenciales inválidas.
        </div>
        <div th:if="${param.logout}" class="alert">
            Sesión cerrada.
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="username">Correo</label>
            <input id="username" name="username" type="email" autocomplete="username" required/>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required/>

            <button type="submit">Entrar</button>
        </form>

        <p class="hint">Usa un usuario existente en la tabla <code>usuario</code>.</p>
    </div>
</div>
</body>
</html>
