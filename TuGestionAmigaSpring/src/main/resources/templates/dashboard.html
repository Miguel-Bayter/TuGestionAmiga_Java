<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/app :: appPage('dashboard', 'Dashboard', 'Panel principal del módulo Spring', ~{::content})}">
<div th:fragment="content">
    <div class="card tga-card mb-3">
        <div class="card-body">
            <h2 class="h5 mb-2">Bienvenido</h2>
            <div class="text-muted">
                Has iniciado sesión como
                <strong sec:authentication="name"></strong>.
                <span class="ms-1">Roles: <span sec:authentication="authorities"></span></span>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div sec:authorize="hasRole('ADMIN')" class="col-md-6 col-xl-4">
            <a class="card tga-card tga-hover text-decoration-none h-100" th:href="@{/usuarios}">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <i class="bi bi-people text-primary fs-4"></i>
                        <h3 class="h6 m-0">Usuarios</h3>
                    </div>
                    <div class="text-muted">Crear, listar, editar y eliminar usuarios.</div>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-xl-4">
            <a class="card tga-card tga-hover text-decoration-none h-100" th:href="@{/libros}">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <i class="bi bi-journal-bookmark text-primary fs-4"></i>
                        <h3 class="h6 m-0">Libros</h3>
                    </div>
                    <div class="text-muted">Administrar catálogo y disponibilidad.</div>
                </div>
            </a>
        </div>

        <div class="col-md-6 col-xl-4">
            <a class="card tga-card tga-hover text-decoration-none h-100" th:href="@{/prestamos}">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <i class="bi bi-arrow-left-right text-primary fs-4"></i>
                        <h3 class="h6 m-0">Préstamos</h3>
                    </div>
                    <div class="text-muted">Registrar préstamos y devoluciones.</div>
                </div>
            </a>
        </div>
    </div>
</div>
</html>
